name: Build and Deploy Dockerfile

on:
  push:
    branches: [main]

concurrency:
  group: "build"

env:
  DOCKER_TAG: ${{ secrets.DOCKER_HUB_USERNAME }}/htmx-blog:latest

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Check build
        run: |
          npm run css
          templ generate
          go build
      - name: Check links
        run: |
          go run . -log warn &
          sleep 3
          npx broken-link-checker http://localhost:3000 -ro \
            --exclude "https://freefrontend.com/*" \
            --exclude "https://nixos.org/*" \
            --exclude "https://woile.dev/*" \
            --exclude "https://www.sfml-dev.org/" \
            --exclude "**/*.shortcut" \
            --exclude "**/*.xml"

  website:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_TAG }}
